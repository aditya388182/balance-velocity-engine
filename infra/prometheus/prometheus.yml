global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true          # keep the job label the pusher set, not "pushgateway"
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
