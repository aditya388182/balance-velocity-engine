name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-core:
    name: Hermetic Core Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install requirements-core
        run: pip install -r requirements-core.txt
      - name: Gate the 8 committed fixtures
        run: pytest spark/tests/

  state-schema-gate:
    name: Checkpoint Identity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Assert STATE_SCHEMA is unchanged
        run: grep "STATE_SCHEMA" spark/engine/sequencer.py || exit 1

  sigkill-recovery:
    name: Real SIGKILL Recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install full requirements
        run: pip install -r requirements.txt
      - name: Run recovery matrix
        run: pytest spark/tests/test_ci_matrix.py -k restart

  terraform-validate:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - run: terraform init -backend=false
      - run: terraform validate
